<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence maker — Design tools</title>
<link rel="stylesheet" href="tool-shell.css?v=202611061200">
<link rel="stylesheet" href="tool-grid.css?v=202611061200">
</head>
<body>
<script src="tool-canvas.js?v=202611061200"></script>
<script src="tool-slide.js?v=202611061200"></script>
<script src="tool-grid.js?v=202611061200"></script>
<script>
(function () {
  const SOURCE = 'c1', CONFIDENCE = 'c3';
  const columns = () => [
    { id: 'c0', name: 'What we observed', tone: 'blue', w: 1.3 },
    { id: SOURCE, name: 'Where it came from', tone: 'white' },
    { id: 'c2', name: 'What we think it means', tone: 'amber', w: 1.3 },
    { id: CONFIDENCE, name: 'How sure we are', tone: 'grey', w: 0.7, choice: ['High', 'Medium', 'Low'] },
    { id: 'c4', name: 'Opportunity', tone: 'green', w: 1.3 },
  ];
  const blank = () => ({ title: '', view: 'both', cells: {}, cols: columns(), rows: ['Finding 1', 'Finding 2', 'Finding 3'].map((name, i) => ({ id: 'r' + i, name, tone: 'white' })) });
  /* a finding with words in it but no source is an assumption, whatever confidence was picked */
  function notes(r, c, S, typed) {
    if (c.id !== CONFIDENCE || !S.cols.some(x => x.id === SOURCE)) return typed;
    const any = S.cols.some(x => x.id !== CONFIDENCE && String(S.cells[r.id + '|' + x.id] || '').trim());
    return any && !String(S.cells[r.id + '|' + SOURCE] || '').trim() ? ['Assumption: no source yet'] : typed;
  }
  /* the same missed bin case as the other tools */
  function example() {
    const s = blank(); s.title = 'Report a missed bin collection: what we found';
    s.rows = ['Chasing a report', 'Bin types', 'Conflicting dates', 'Phone reports'].map((name, i) => ({ id: 'r' + i, name, tone: 'white' }));
    const fill = {
      0: ['Four of five calls listened to were chasing a report', 'Contact centre calls, five listened to', 'People do not know whether anything is happening', 'Medium', 'Say when the return round is due'],
      1: ['Three of six people stopped at the bin type', 'Usability sessions, six people', 'The form uses categories and people think in colours', 'High', 'Find the bins from the postcode'],
      2: ['Calendar and website disagreed on three of ten rounds', 'Comparison of ten rounds', 'People cannot tell a missed collection from an early one', 'High', 'One source for collection days'],
      3: ['Staff seem to keep their own notes of phone reports', '', 'Phone reports may never reach the case system', 'Low', 'Contact centre uses the same form'],
    };
    Object.keys(fill).forEach(r => fill[r].forEach((t, c) => { if (t) s.cells[`r${r}|c${c}`] = t; }));
    return s;
  }
  window.GridTool({
    key: 'dt-evidence', tag: 'EVIDENCE1', name: 'Evidence maker', what: 'evidence', kicker: 'EVIDENCE',
    colWord: 'column', laneWord: 'finding', colName: n => 'Column ' + n, titleHint: 'The service, and the research this comes from',
    blank, example, notes,
    help: `<ul>
      <li><b>Findings</b> run down, one row each. Name each after its theme.</li>
      <li><b>Read across:</b> what you observed, where it came from, what you think it means, how sure you are, and the opportunity it opens.</li>
      <li><b>Keep observing and interpreting apart.</b> “Three of six stopped here” is an observation. “The categories confuse people” is what you think it means.</li>
      <li><b>A finding with no source</b> shows “Assumption: no source yet” on the slide, whatever confidence you picked. Add the source and your choice comes back.</li>
      <li><b>On slide</b> shows or hides a finding, and one note per line becomes its own note on the slide.</li>
      <li><b>Nothing is cut off.</b> The text gets smaller until everything fits, and the tool says when it is too small to read on a call.</li>
      <li><b>Copy the slide</b> puts a 16:9 picture on the clipboard. If the browser refuses, it downloads.</li>
    </ul>`,
  });
})();
</script>
</body>
</html>
